<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FeedMate — Multi-Tenant Retail &amp; Wholesale POS for animal feed stores.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FeedMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FeedMate</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // This is a back-office/admin web app with no offline requirement, so
    // builds are produced with --pwa-strategy=none: a fresh visit never
    // registers a caching service worker. This one-time cleanup exists
    // only to release anyone who already has an OLD caching service
    // worker installed from a build before this change — otherwise that
    // old worker can keep serving a stale cached app (including a stale
    // copy of THIS file) indefinitely, since a page reload alone doesn't
    // reliably escape it. Safe to run on every load: once there's nothing
    // registered/cached, both calls are instant no-ops.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const reg of regs) reg.unregister();
      });
    }
    if (window.caches) {
      caches.keys().then((keys) => {
        for (const key of keys) caches.delete(key);
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
