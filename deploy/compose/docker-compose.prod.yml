# Production deployment for feedmate.ramadas.me — fully isolated from any
# other application on the host. No ports are published to the host at
# all: Postgres and the API are reachable only from other containers on
# the `feedmate_internal` network, and the API is additionally attached
# to the pre-existing `feedmate_public` external network so the host's
# shared Caddy reverse proxy (which belongs to a different, unrelated
# project) can reach it by container name — Caddy's own config and the
# other applications it serves are never touched by this file.
#
# Deploy with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Run migrations once (and after every migration-adding deploy) with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedmate
      POSTGRES_USER: feedmate_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - feedmate_pgdata:/var/lib/postgresql/data
    networks:
      - feedmate_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedmate_owner -d feedmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: feedmate-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations
    networks:
      - feedmate_internal
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://feedmate_owner:${POSTGRES_PASSWORD}@postgres:5432/feedmate?sslmode=disable",
        "up"
      ]
    profiles: ["migrate"]

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: feedmate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/feedmate?sslmode=disable
      DATABASE_ADMIN_URL: postgres://app_admin:${APP_ADMIN_PASSWORD}@postgres:5432/feedmate?sslmode=disable
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      LOG_LEVEL: info
    networks:
      - feedmate_internal
      - feedmate_public

  web:
    image: nginx:1.27-alpine
    container_name: feedmate-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - feedmate_public

networks:
  feedmate_internal:
    name: feedmate_internal
  feedmate_public:
    name: feedmate_public
    external: true

volumes:
  feedmate_pgdata:
    name: feedmate_pgdata
