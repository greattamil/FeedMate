# Local development environment for the Andipatti Animal Feed System.
# `docker compose -f deploy/compose/docker-compose.yml up -d` from the repo root.

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: feedmate
      POSTGRES_USER: feedmate_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_owner_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - feedmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedmate_owner -d feedmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: feedmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: feedmate-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../db/migrations:/migrations
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://feedmate_owner:${POSTGRES_PASSWORD:-dev_owner_password_change_me}@postgres:5432/feedmate?sslmode=disable",
        "up"
      ]
    profiles: ["migrate"]

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: feedmate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD:-dev_app_password_change_me}@postgres:5432/feedmate?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev_only_change_me}
      LOG_LEVEL: debug
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    container_name: feedmate-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD:-dev_app_password_change_me}@postgres:5432/feedmate?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: debug

volumes:
  feedmate_pgdata:
